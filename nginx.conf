server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre: cache agresiva, nunca cambian
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fuentes y sonidos del teclado mecánico
    location ~* \.(woff2?|ttf|otf|eot|mp3|wav|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea, así los despliegues se ven al instante
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Endpoint para las probes de Kubernetes
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Fallback de SPA: cualquier ruta desconocida sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}